name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - working-directory: tgame-app
        run: npm ci
      - name: tag matches package.json
        working-directory: tgame-app
        shell: bash
        run: |
          want="${GITHUB_REF_NAME#v}"
          have=$(node -p "require('./package.json').version")
          if [ "$want" != "$have" ]; then echo "tag $GITHUB_REF_NAME but package.json says $have"; exit 1; fi
      - working-directory: tgame-app
        run: |
          npm run sync
          npm test
      - name: build and publish the installer
        working-directory: tgame-app
        run: npx electron-builder --win nsis --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
