[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tgame"
dynamic = ["version"]
description = "Play and lightly manipulate .tgame text adventures. No dependencies."
readme = "README.md"
requires-python = ">=3.8"
keywords = ["text adventure", "interactive fiction", "tgame", "game engine"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Games/Entertainment :: Role-Playing",
  "Topic :: Games/Entertainment :: Text Adventure",
  "Environment :: Console",
]

[project.scripts]
tgame = "tgame.cli:main"

[tool.setuptools.dynamic]
version = { attr = "tgame.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tgame = ["_data/*.js"]
